# No host ports. The dashboard and connector share one isolated namespace.
services:
  web:
    image: nginx:alpine
    user: "101:101"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0700
      - /var/run:uid=101,gid=101,mode=0700
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 30s
      timeout: 5s
      retries: 3
  qurl:
    # Official qurl v2.6.0 release image, pinned by immutable digest.
    image: ghcr.io/layervai/qurl@sha256:e86cda064fc4d2fdb5909b7f05bbe814e5cde21461732a117bf081c9b5a8fb47
    user: "65532:65532"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      web:
        condition: service_healthy
    network_mode: service:web
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=0700,size=64m
    volumes:
      - ./state-v2:/var/lib/qurl
    environment:
      HOME: /tmp
      QURL_CONNECTOR_STATE_DIR: /var/lib/qurl
      QURL_CONNECTOR_RUNTIME_DIR: /tmp/qurl
    pids_limit: 512
    ulimits:
      nofile: {soft: 4096, hard: 4096}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    # Native enrollment via `qurl login`; the same production daemon engine
    # stays in the container process and reuses this stable Connector ID.
    command: [publish, "http://127.0.0.1:8080", --foreground, --id, everhaven-dashboard-prod]
